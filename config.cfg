[shells]
; вероятность каждого особого патрона при подходящей зарядке
hidden_chance=0.25
heal_chance=0.25
black_chance=0.18

[enchantments]
; вероятность зачарования при доставании из ящика
grab_chance=0.12

[beer]
drunk_chance=0.1

[controls]
; клавиша автодоставания предметов из ящика (G, H, F1...)
autograb_key="G"

[easter]
tail_names=["Sergkomp"]

[debug]
; offline_test=true — оффлайн-стол с 4 ботами; autotest=true — прогон автотеста
offline_test=false
autotest=false
autotest_quick=false
