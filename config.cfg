; BRMod — настройки. Для раздачи предметов и патронов действуют настройки ХОСТА.
; enabled        — выпадает ли предмет
; max_per_player — сколько штук может быть у одного игрока
; max_on_table   — сколько штук всего на столе

[uno_red]
enabled=true
max_per_player=1
max_on_table=2

